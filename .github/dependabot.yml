version: 2

# Canonical dependabot config for npm/TypeScript repos in forgesworn.
# Synced from forgesworn/.github/templates/dependabot/dependabot.npm.yml.
# Edit the template, not individual repos -- run the propagator to sync.
#
# Tiering:
#   patch + minor  -> grouped, auto-merged on green CI
#   major          -> individual PR, manual review
#   TS / Node / framework majors -> ignored here, upgraded deliberately

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # First match wins. @vitest/* peer-depend on the exact vitest version, so
      # an ungrouped major raises one PR per package and neither can install:
      # npm ci dies on ERESOLVE. Grouped across all update types, so majors
      # stay under manual review but arrive together and installable.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["patch", "minor", "major"]
      production-minor:
        dependency-type: production
        update-types: ["patch", "minor"]
      dev-minor:
        dependency-type: development
        update-types: ["patch", "minor"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor:
        update-types: ["patch", "minor"]
